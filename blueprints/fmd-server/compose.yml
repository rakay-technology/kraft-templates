services:
  fmd-server:
    image: registry.gitlab.com/fmd-foss/fmd-server:0.16.0
    expose:
      - 8080
    environment:
      - FMD_REGISTRATIONTOKEN=${registration_token}
      - FMD_USERIDLENGTH=5
      - FMD_MAXSAVEDLOC=1000
      - FMD_MAXSAVEDPIC=10
    volumes:
      - fmd-server-data:/var/lib/fmd-server/db/
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - timeout 10s bash -c ':> /dev/tcp/127.0.0.1/8080'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
      start_interval: 3s
volumes:
  fmd-server-data: null
