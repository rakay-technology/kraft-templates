services:
  pocket-id:
    image: pocketid/pocket-id:v2.14.0
    restart: unless-stopped
    environment:
      APP_URL: https://${main_domain}
      ENCRYPTION_KEY: ${encryption_key}
      TRUST_PROXY: "true"
    volumes:
      - pocket-id-data:/app/data
    expose:
      - "1411"
    healthcheck:
      test:
        - CMD
        - /app/pocket-id
        - healthcheck
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
volumes:
  pocket-id-data: null
