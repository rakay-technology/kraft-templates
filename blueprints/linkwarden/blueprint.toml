[variables]
main_domain = "${domain}"
postgres_password = "${password}"
next_secret = "${base64:32}"
NEXTAUTH_SECRET = "${password:32}"

[[routes]]
service = "linkwarden"
port = 3000
host = "${main_domain}"

[env]
POSTGRES_PASSWORD = "${postgres_password}"
NEXTAUTH_SECRET = "${next_secret}"
NEXTAUTH_URL = "http://${main_domain}/api/v1/auth"
