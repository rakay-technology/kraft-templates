[variables]
main_domain = "${domain}"
postgres_password = "${password:32}"

[[routes]]
service = "zabbix-web-nginx-pgsql"
port = 8080
host = "${main_domain}"

[env]
POSTGRES_DB = "zabbix"
POSTGRES_USER = "zabbix"
POSTGRES_PASSWORD = "${postgres_password}"
PHP_TZ = "UTC"
ZBX_SERVER_NAME = "Dokploy Zabbix Monitoring"
