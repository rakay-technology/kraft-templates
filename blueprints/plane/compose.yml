services:
  plane-web:
    image: makeplane/plane-frontend:v1.3.1
    restart: unless-stopped
    depends_on:
      - plane-api
      - plane-worker
    volumes: []
  plane-space:
    image: makeplane/plane-space:v1.3.1
    restart: unless-stopped
    depends_on:
      - plane-api
      - plane-worker
      - plane-web
    volumes: []
  plane-admin:
    image: makeplane/plane-admin:v1.3.1
    restart: unless-stopped
    depends_on:
      - plane-api
      - plane-web
    volumes: []
  plane-live:
    image: makeplane/plane-live:v1.3.1
    restart: unless-stopped
    environment:
      <<:
        - API_BASE_URL: http://plane-api:8000
          LIVE_SERVER_SECRET_KEY: dev-only-change-me
        - REDIS_HOST: plane-redis
          REDIS_PORT: "6379"
          REDIS_URL: redis://plane-redis:6379/
    depends_on:
      - plane-api
      - plane-web
    volumes: []
  plane-api:
    image: makeplane/plane-backend:v1.3.1
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    volumes:
      - logs_api:/code/plane/logs
    environment:
      <<:
        - WEB_URL: http://localhost
          DEBUG: "0"
          CORS_ALLOWED_ORIGINS: http://localhost
          GUNICORN_WORKERS: "1"
          USE_MINIO: "1"
          DATABASE_URL: postgresql://plane:plane@plane-db/plane
          SECRET_KEY: dev-only-change-me
          AMQP_URL: amqp://plane:plane@plane-mq:5672/plane
          API_KEY_RATE_LIMIT: 60/minute
          MINIO_ENDPOINT_SSL: "0"
          LIVE_SERVER_SECRET_KEY: dev-only-change-me
          WEBHOOK_ALLOWED_IPS: ""
          WEBHOOK_ALLOWED_HOSTS: ""
        - PGHOST: plane-db
          PGDATABASE: plane
          POSTGRES_USER: plane
          POSTGRES_PASSWORD: plane
          POSTGRES_DB: plane
          POSTGRES_PORT: "5432"
          PGDATA: /var/lib/postgresql/data
        - REDIS_HOST: plane-redis
          REDIS_PORT: "6379"
          REDIS_URL: redis://plane-redis:6379/
        - MINIO_ROOT_USER: access-key
          MINIO_ROOT_PASSWORD: secret-key
        - AWS_REGION: ""
          AWS_ACCESS_KEY_ID: access-key
          AWS_SECRET_ACCESS_KEY: secret-key
          AWS_S3_ENDPOINT_URL: http://plane-minio:9000
          AWS_S3_BUCKET_NAME: uploads
        - APP_DOMAIN: localhost
          FILE_SIZE_LIMIT: "5242880"
          BUCKET_NAME: uploads
          SITE_ADDRESS: :80
          TRUSTED_PROXIES: private_ranges
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
      - plane-migrator
  plane-worker:
    image: makeplane/plane-backend:v1.3.1
    restart: unless-stopped
    command: ./bin/docker-entrypoint-worker.sh
    volumes:
      - logs_worker:/code/plane/logs
    environment:
      <<:
        - WEB_URL: http://localhost
          DEBUG: "0"
          CORS_ALLOWED_ORIGINS: http://localhost
          GUNICORN_WORKERS: "1"
          USE_MINIO: "1"
          DATABASE_URL: postgresql://plane:plane@plane-db/plane
          SECRET_KEY: dev-only-change-me
          AMQP_URL: amqp://plane:plane@plane-mq:5672/plane
          API_KEY_RATE_LIMIT: 60/minute
          MINIO_ENDPOINT_SSL: "0"
          LIVE_SERVER_SECRET_KEY: dev-only-change-me
          WEBHOOK_ALLOWED_IPS: ""
          WEBHOOK_ALLOWED_HOSTS: ""
        - PGHOST: plane-db
          PGDATABASE: plane
          POSTGRES_USER: plane
          POSTGRES_PASSWORD: plane
          POSTGRES_DB: plane
          POSTGRES_PORT: "5432"
          PGDATA: /var/lib/postgresql/data
        - REDIS_HOST: plane-redis
          REDIS_PORT: "6379"
          REDIS_URL: redis://plane-redis:6379/
        - MINIO_ROOT_USER: access-key
          MINIO_ROOT_PASSWORD: secret-key
        - AWS_REGION: ""
          AWS_ACCESS_KEY_ID: access-key
          AWS_SECRET_ACCESS_KEY: secret-key
          AWS_S3_ENDPOINT_URL: http://plane-minio:9000
          AWS_S3_BUCKET_NAME: uploads
        - APP_DOMAIN: localhost
          FILE_SIZE_LIMIT: "5242880"
          BUCKET_NAME: uploads
          SITE_ADDRESS: :80
          TRUSTED_PROXIES: private_ranges
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
      - plane-migrator
  plane-beat-worker:
    image: makeplane/plane-backend:v1.3.1
    restart: unless-stopped
    command: ./bin/docker-entrypoint-beat.sh
    volumes:
      - logs_beat-worker:/code/plane/logs
    environment:
      <<:
        - WEB_URL: http://localhost
          DEBUG: "0"
          CORS_ALLOWED_ORIGINS: http://localhost
          GUNICORN_WORKERS: "1"
          USE_MINIO: "1"
          DATABASE_URL: postgresql://plane:plane@plane-db/plane
          SECRET_KEY: dev-only-change-me
          AMQP_URL: amqp://plane:plane@plane-mq:5672/plane
          API_KEY_RATE_LIMIT: 60/minute
          MINIO_ENDPOINT_SSL: "0"
          LIVE_SERVER_SECRET_KEY: dev-only-change-me
          WEBHOOK_ALLOWED_IPS: ""
          WEBHOOK_ALLOWED_HOSTS: ""
        - PGHOST: plane-db
          PGDATABASE: plane
          POSTGRES_USER: plane
          POSTGRES_PASSWORD: plane
          POSTGRES_DB: plane
          POSTGRES_PORT: "5432"
          PGDATA: /var/lib/postgresql/data
        - REDIS_HOST: plane-redis
          REDIS_PORT: "6379"
          REDIS_URL: redis://plane-redis:6379/
        - MINIO_ROOT_USER: access-key
          MINIO_ROOT_PASSWORD: secret-key
        - AWS_REGION: ""
          AWS_ACCESS_KEY_ID: access-key
          AWS_SECRET_ACCESS_KEY: secret-key
          AWS_S3_ENDPOINT_URL: http://plane-minio:9000
          AWS_S3_BUCKET_NAME: uploads
        - APP_DOMAIN: localhost
          FILE_SIZE_LIMIT: "5242880"
          BUCKET_NAME: uploads
          SITE_ADDRESS: :80
          TRUSTED_PROXIES: private_ranges
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
      - plane-migrator
  plane-migrator:
    image: makeplane/plane-backend:v1.3.1
    restart: on-failure
    command: ./bin/docker-entrypoint-migrator.sh
    volumes:
      - logs_migrator:/code/plane/logs
    environment:
      <<:
        - WEB_URL: http://localhost
          DEBUG: "0"
          CORS_ALLOWED_ORIGINS: http://localhost
          GUNICORN_WORKERS: "1"
          USE_MINIO: "1"
          DATABASE_URL: postgresql://plane:plane@plane-db/plane
          SECRET_KEY: dev-only-change-me
          AMQP_URL: amqp://plane:plane@plane-mq:5672/plane
          API_KEY_RATE_LIMIT: 60/minute
          MINIO_ENDPOINT_SSL: "0"
          LIVE_SERVER_SECRET_KEY: dev-only-change-me
          WEBHOOK_ALLOWED_IPS: ""
          WEBHOOK_ALLOWED_HOSTS: ""
        - PGHOST: plane-db
          PGDATABASE: plane
          POSTGRES_USER: plane
          POSTGRES_PASSWORD: plane
          POSTGRES_DB: plane
          POSTGRES_PORT: "5432"
          PGDATA: /var/lib/postgresql/data
        - REDIS_HOST: plane-redis
          REDIS_PORT: "6379"
          REDIS_URL: redis://plane-redis:6379/
        - MINIO_ROOT_USER: access-key
          MINIO_ROOT_PASSWORD: secret-key
        - AWS_REGION: ""
          AWS_ACCESS_KEY_ID: access-key
          AWS_SECRET_ACCESS_KEY: secret-key
          AWS_S3_ENDPOINT_URL: http://plane-minio:9000
          AWS_S3_BUCKET_NAME: uploads
        - APP_DOMAIN: localhost
          FILE_SIZE_LIMIT: "5242880"
          BUCKET_NAME: uploads
          SITE_ADDRESS: :80
          TRUSTED_PROXIES: private_ranges
    depends_on:
      - plane-db
      - plane-redis
  plane-db:
    image: postgres:17-alpine
    restart: unless-stopped
    command: postgres -c 'max_connections=1000'
    environment:
      <<:
        PGHOST: plane-db
        PGDATABASE: plane
        POSTGRES_USER: plane
        POSTGRES_PASSWORD: plane
        POSTGRES_DB: plane
        POSTGRES_PORT: "5432"
        PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U plane -d plane
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test:
        - CMD-SHELL
        - valkey-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    environment:
      <<:
        RABBITMQ_HOST: plane-mq
        RABBITMQ_PORT: "5672"
        RABBITMQ_DEFAULT_USER: plane
        RABBITMQ_DEFAULT_PASS: plane
        RABBITMQ_DEFAULT_VHOST: plane
        RABBITMQ_VHOST: plane
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
  plane-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /export --console-address ":9090"
    environment:
      <<:
        MINIO_ROOT_USER: access-key
        MINIO_ROOT_PASSWORD: secret-key
    volumes:
      - uploads:/export
  proxy:
    image: makeplane/plane-proxy:v1.3.1
    restart: unless-stopped
    expose:
      - "80"
    environment:
      <<:
        APP_DOMAIN: localhost
        FILE_SIZE_LIMIT: "5242880"
        BUCKET_NAME: uploads
        SITE_ADDRESS: :80
        TRUSTED_PROXIES: private_ranges
    volumes:
      - proxy_config:/config
      - proxy_data:/data
    links:
      - plane-web:web
      - plane-api:api
      - plane-space:space
      - plane-admin:admin
      - plane-live:live
    depends_on:
      - plane-web
      - plane-api
      - plane-space
      - plane-admin
      - plane-live
volumes:
  pgdata: null
  redisdata: null
  uploads: null
  rabbitmq_data: null
  logs_api: null
  logs_worker: null
  logs_beat-worker: null
  logs_migrator: null
  proxy_config: null
  proxy_data: null
