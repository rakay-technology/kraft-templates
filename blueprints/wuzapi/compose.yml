services:
  wuzapi-server:
    image: asternic/wuzapi:sha-30c1805
    restart: unless-stopped
    expose:
      - 8080
    environment:
      - WUZAPI_ADMIN_TOKEN=${admin_token}
      - WUZAPI_GLOBAL_ENCRYPTION_KEY=${encryption_key}
      - DB_USER=wuzapi
      - DB_PASSWORD=wuzapi
      - DB_NAME=wuzapi
      - DB_HOST=db
      - DB_PORT=5432
      - TZ=UTC
    depends_on:
      - db
    volumes: []
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: wuzapi
      POSTGRES_PASSWORD: wuzapi
      POSTGRES_DB: wuzapi
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $wuzapi
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  db_data: null
