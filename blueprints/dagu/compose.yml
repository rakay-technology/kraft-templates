services:
  dagu:
    image: ghcr.io/dagucloud/dagu:2.10.7
    command: dagu start-all
    restart: unless-stopped
    expose:
      - 8080
    volumes:
      - dagu-data:/var/lib/dagu
    environment:
      - DAGU_HOST=0.0.0.0
      - DAGU_PORT=8080
      - DAGU_AUTH_MODE=basic
      - DAGU_AUTH_BASIC_USERNAME=admin
      - DAGU_AUTH_BASIC_PASSWORD=${admin_password}
volumes:
  dagu-data: {}
