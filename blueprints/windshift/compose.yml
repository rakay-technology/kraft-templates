services:
  windshift:
    image: ghcr.io/windshiftapp/windshift:v0.7.2
    restart: unless-stopped
    environment:
      - BASE_URL=https://${main_domain}
      - PORT=8080
      - USE_PROXY=true
      - SSO_SECRET=${sso_secret}
      - ATTACHMENT_PATH=/data/attachments
      - DB_TYPE=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=windshift
      - POSTGRES_PASSWORD=${db_password}
      - POSTGRES_DB=windshift
      - LOG_LEVEL=info
      - LOG_FORMAT=json
    volumes:
      - windshift-data:/data
    depends_on:
      db:
        condition: service_healthy
    expose:
      - 8080
  db:
    image: postgres:17.4
    restart: unless-stopped
    environment:
      - POSTGRES_USER=windshift
      - POSTGRES_PASSWORD=${db_password}
      - POSTGRES_DB=windshift
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  windshift-data: {}
  postgres-data: {}
