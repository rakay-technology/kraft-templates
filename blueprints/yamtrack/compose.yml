services:
  yamtrack:
    image: ghcr.io/fuzzygrim/yamtrack:0.26.3
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - TZ=Europe/Berlin
      - SECRET=${SECRET}
      - REDIS_URL=redis://redis:6379
    volumes:
      - yamtrack-db:/yamtrack/db
    expose:
      - 8000
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
volumes:
  yamtrack-db: {}
  redis_data: {}
