services:
  emqx:
    image: emqx/emqx-enterprise:6.0.1
    hostname: node1.emqx.com
    environment:
      EMQX_NODE_NAME: emqx@node1.emqx.com
    expose:
      - 1883
      - 8083
      - 18083
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - /opt/emqx/bin/emqx_ctl
        - status
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  emqx_data: null
  emqx_log: null
