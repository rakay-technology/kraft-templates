services:
  mailserver:
    image: analogic/poste.io:2.5.16
    restart: unless-stopped
    hostname: mail.${DOMAIN}
    environment:
      - TZ=UTC
      - HTTPS=OFF
      - HTTP_PORT=8080
    volumes:
      - poste-data:/data
    expose:
      - 25
      - 110
      - 143
      - 465
      - 587
      - 993
      - 995
      - 4190
      - 8080
volumes:
  poste-data: {}
