[variables]
main_domain = "${domain}"
locale = "en-US"
db_name = "akaunting"
db_user = "admin"
mysql_password = "${password:24}"
company_name = "My Company"
company_email = "${email}"
admin_email = "${email}"
admin_password = "${password:24}"
AUTO_HASH_1 = "${hash:3}"
AUTO_HASH_2 = "${hash:3}"
AUTO_HASH_3 = "${hash:3}"

[[routes]]
service = "akaunting"
port = 80
host = "${main_domain}"

[env]
db_prefix = "${AUTO_HASH_2}_"
APP_URL = "${main_domain}"
LOCALE = "${locale}"
DB_HOST = "akaunting-db"
DB_PORT = "3306"
DB_NAME = "${db_name}"
DB_USERNAME = "${db_user}"
DB_PASSWORD = "${mysql_password}"
DB_PREFIX = "${AUTO_HASH_3}_"
COMPANY_NAME = "${company_name}"
COMPANY_EMAIL = "${company_email}"
ADMIN_EMAIL = "${admin_email}"
ADMIN_PASSWORD = "${admin_password}"
MYSQL_DATABASE = "${db_name}"
MYSQL_USER = "${db_user}"
MYSQL_PASSWORD = "${mysql_password}"
MYSQL_RANDOM_ROOT_PASSWORD = "yes"
