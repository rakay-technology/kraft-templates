services:
  akaunting:
    image: akaunting/akaunting:3.1.21-v
    restart: unless-stopped
    depends_on:
      akaunting-db:
        condition: service_healthy
    environment:
      APP_URL: ${main_domain}
      LOCALE: ${locale}
      DB_HOST: akaunting-db
      DB_PORT: 3306
      DB_NAME: ${db_name}
      DB_USERNAME: ${db_user}
      DB_PASSWORD: ${mysql_password}
      DB_PREFIX: ${AUTO_HASH_1}_
      COMPANY_NAME: ${company_name}
      COMPANY_EMAIL: ${company_email}
      ADMIN_EMAIL: ${admin_email}
      ADMIN_PASSWORD: ${admin_password}
    expose:
      - "80"
    volumes:
      - akaunting-data:/var/www/html
  akaunting-db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${db_name}
      MYSQL_USER: ${db_user}
      MYSQL_PASSWORD: ${mysql_password}
      MYSQL_RANDOM_ROOT_PASSWORD: yes
    volumes:
      - akaunting-db:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  akaunting-data: {}
  akaunting-db: {}
