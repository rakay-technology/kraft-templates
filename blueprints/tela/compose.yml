services:
  proxy:
    image: ghcr.io/zcag/tela-proxy:0.7.0
    restart: unless-stopped
    environment:
      - TELA_SITE_ADDRESS=:80
      - TELA_UPSTREAM_BACKEND=backend:8080
      - TELA_UPSTREAM_FRONTEND=frontend:80
    depends_on:
      - backend
      - frontend
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    expose:
      - 80
  backend:
    image: ghcr.io/zcag/tela-backend:0.7.0
    restart: unless-stopped
    environment:
      - TELA_PUBLIC_BASE_URL=https://${main_domain}
      - TELA_DATABASE_URL=postgres://tela:${pg_password}@postgres:5432/tela?sslmode=disable
      - TELA_SHARE_SECRET=${share_secret}
      - TELA_API_KEY_SECRET=${api_key_secret}
      - TELA_DECK_URL=http://deck:3344
      - TELA_GOTENBERG_URL=http://gotenberg:3000
      - TELA_PDF_RENDER_BASE_URL=http://proxy
    depends_on:
      postgres:
        condition: service_healthy
    volumes: []
  frontend:
    image: ghcr.io/zcag/tela-frontend:0.7.0
    restart: unless-stopped
    volumes: []
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=tela
      - POSTGRES_PASSWORD=${pg_password}
      - POSTGRES_DB=tela
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U tela -d tela
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
  deck:
    image: ghcr.io/zcag/tela-deck:0.7.0
    restart: unless-stopped
    volumes:
      - deckcache:/data
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    volumes: []
volumes:
  pgdata: null
  deckcache: null
  caddy-data: null
  caddy-config: null
