services:
  grist:
    image: gristlabs/grist:1.7.19
    restart: unless-stopped
    expose:
      - 8484
    volumes:
      - grist_data:/persist
    environment:
      GRIST_DEFAULT_EMAIL: ""
      GRIST_SESSION_SECRET: ""
      GRIST_SINGLE_ORG: ""
      GRIST_HOME_INSTANCE: ""
volumes:
  grist_data: null
