services:
  systemprompt:
    image: ghcr.io/systempromptio/systemprompt-template:0
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://systemprompt:${postgres_password}@postgres:5432/systemprompt
      ANTHROPIC_API_KEY: ${anthropic_api_key}
      OPENAI_API_KEY: ${openai_api_key}
      GEMINI_API_KEY: ${gemini_api_key}
      EXTERNAL_URL: ${main_domain}
      ADMIN_EMAIL: ${admin_email}
      HOST: 0.0.0.0
      PORT: 8080
    expose:
      - 8080
    volumes:
      - systemprompt_web:/app/web
      - systemprompt_storage:/app/storage/data
      - systemprompt_profiles:/app/services/profiles/docker
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/api/v1/health
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 3
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: systemprompt
      POSTGRES_PASSWORD: ${postgres_password}
      POSTGRES_DB: systemprompt
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U systemprompt -d systemprompt
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  systemprompt_web: null
  systemprompt_storage: null
  systemprompt_profiles: null
  postgres_data: null
