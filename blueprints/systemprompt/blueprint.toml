[variables]
main_domain = "${domain}"
postgres_password = "${password:32}"
anthropic_api_key = "CHANGEME-replace-me"
openai_api_key = "CHANGEME-replace-me"
gemini_api_key = "CHANGEME-replace-me"

[[routes]]
service = "systemprompt"
port = 8080
host = "${main_domain}"

[env]
POSTGRES_PASSWORD = "${postgres_password}"
EXTERNAL_URL = "${main_domain}"
ANTHROPIC_API_KEY = "${anthropic_api_key}"
OPENAI_API_KEY = "${openai_api_key}"
GEMINI_API_KEY = "${gemini_api_key}"
