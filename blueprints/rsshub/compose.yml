services:
  rsshub:
    image: diygod/rsshub:2026-09-14
    restart: always
    expose:
      - 1200
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/
      PUPPETEER_WS_ENDPOINT: ws://browserless:3000
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:1200/healthz
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis
      - browserless
    volumes: []
  browserless:
    image: browserless/chrome:1.61.1-puppeteer-21.9.0
    restart: always
    ulimits:
      core:
        hard: 0
        soft: 0
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3000/pressure
      interval: 30s
      timeout: 10s
      retries: 3
    volumes: []
  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
volumes:
  redis-data: null
