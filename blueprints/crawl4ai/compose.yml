services:
  crawl4ai:
    image: unclecode/crawl4ai:0.9.3
    restart: unless-stopped
    shm_size: 1g
    expose:
      - 11235
    environment:
      - LLM_PROVIDER=openai/gpt-4o-mini
      - OPENAI_API_KEY=48
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:11235/health
      interval: 30s
      timeout: 10s
      retries: 3
    volumes: []
