services:
  crawlab-master:
    image: crawlabteam/crawlab:0.6.3
    restart: unless-stopped
    environment:
      - CRAWLAB_NODE_MASTER=Y
      - CRAWLAB_MONGO_HOST=mongo
      - CRAWLAB_MONGO_PORT=27017
      - CRAWLAB_MONGO_DB=crawlab
      - CRAWLAB_MONGO_USERNAME=${MONGO_USERNAME}
      - CRAWLAB_MONGO_PASSWORD=${MONGO_PASSWORD}
      - CRAWLAB_MONGO_AUTHSOURCE=admin
    volumes:
      - crawlab-master-data:/root/.crawlab
      - crawlab-app-data:/data
      - crawlab-logs:/var/log/crawlab
    expose:
      - "8080"
      - "9666"
    depends_on:
      - mongo
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
volumes:
  crawlab-master-data: null
  crawlab-app-data: null
  crawlab-logs: null
  mongo-data: null
