services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16
    depends_on:
      - db
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=db:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=forgejo
      - FORGEJO__server__DOMAIN=${main_domain}
      - FORGEJO__server__SSH_DOMAIN=${main_domain}
      - FORGEJO__server__ROOT_URL=https://${main_domain}/
    restart: always
    expose:
      - 22
      - 3000
    volumes:
      - forgejo_server:/data
  db:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_USER=forgejo
      - POSTGRES_PASSWORD=forgejo
      - POSTGRES_DB=forgejo
    volumes:
      - forgejo_db:/var/lib/postgresql/data
volumes:
  forgejo_db:
    driver: local
  forgejo_server:
    driver: local
