services:
  portabase:
    image: portabase/portabase:1.30.1-arm64
    restart: unless-stopped
    environment:
      - PROJECT_URL=https://${main_domain}
      - PROJECT_SECRET=${project_secret}
      - DATABASE_URL=postgresql://portabase:${postgres_password}@db:5432/portabase?schema=public
      - PROJECT_NAME=Portabase
      - TZ=Europe/Paris
      - LOG_LEVEL=info
      - RETENTION_CRON=0 7 * * *
      - STALE_BACKUP_THRESHOLD_HOURS=6
      - BACKUP_FOLDER_NAME=backups
      - TELEMETRY=true
      - SKIP_ONBOARDING=false
      - API_ENABLED=false
      - OPENAPI_ENABLED=false
      - MCP_ENABLED=false
      - SMTP_HOST=
      - SMTP_PORT=
      - SMTP_USER=
      - SMTP_PASSWORD=
      - SMTP_FROM=
      - SMTP_SECURE=false
    expose:
      - "80"
    volumes:
      - portabase-data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost/api/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  db:
    image: postgres:17-alpine
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=portabase
      - POSTGRES_USER=portabase
      - POSTGRES_PASSWORD=${postgres_password}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U portabase -d portabase
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres-data: null
  portabase-data: null
