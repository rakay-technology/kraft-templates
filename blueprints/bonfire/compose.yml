services:
  bonfire:
    image: bonfirenetworks/bonfire:1.0.5-social-amd64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      search:
        condition: service_started
    environment:
      - HOSTNAME=${main_domain}
      - PUBLIC_PORT=80
      - SERVER_PORT=4000
      - APP_NAME=Bonfire
      - LANG=en_US.UTF-8
      - SECRET_KEY_BASE=${secret_key_base}
      - SIGNING_SALT=${signing_salt}
      - ENCRYPTION_SALT=${encryption_salt}
      - RELEASE_COOKIE=${release_cookie}
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_DB=bonfire_db
      - POSTGRES_PASSWORD=${postgres_password}
      - DB_MIGRATE_INDEXES_CONCURRENTLY=false
      - SEARCH_ADAPTER=meili
      - SEARCH_MEILI_INSTANCE=http://search:7700
      - MEILI_MASTER_KEY=${meili_master_key}
      - MAIL_BACKEND=none
      - MAIL_SERVER=
      - MAIL_PORT=
      - MAIL_USER=
      - MAIL_PASSWORD=
      - MAIL_DOMAIN=
      - MAIL_FROM=
      - MAIL_KEY=
      - UPLOAD_LIMIT=20
    volumes:
      - bonfire-uploads:/opt/app/data/uploads
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:4000
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 120s
    expose:
      - 4000
  db:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=bonfire_db
      - POSTGRES_PASSWORD=${postgres_password}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d bonfire_db
      interval: 10s
      timeout: 5s
      retries: 10
  search:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${meili_master_key}
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
    volumes:
      - search-data:/meili_data
volumes:
  bonfire-uploads: null
  db-data: null
  search-data: null
