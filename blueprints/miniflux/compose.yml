services:
  miniflux:
    image: miniflux/miniflux:2.2.19
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: user=miniflux password=${postgres_password} dbname=miniflux
        host=db sslmode=disable
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: ${admin_username}
      ADMIN_PASSWORD: ${admin_password}
      BASE_URL: https://${main_domain}
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - /usr/bin/miniflux
        - -healthcheck
        - auto
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes: []
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: ${postgres_password}
      POSTGRES_DB: miniflux
    expose:
      - "5432"
    volumes:
      - miniflux-db:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U miniflux -d miniflux
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  miniflux-db: null
