services:
  mage-ai:
    image: mageai/mageai:0.9.78
    command: mage start ${project_name}
    environment:
      USER_CODE_PATH: /home/src/mage-ai
      ENV: production
    expose:
      - 6789
    volumes:
      - mageai_data:/home/src/
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - -s
        - -f
        - -o
        - /dev/null
        - http://localhost:6789
      interval: 30s
      timeout: 10s
      retries: 5
volumes:
  mageai_data: null
