services:
  automatisch:
    image: automatischio/automatisch:0.15.0
    restart: unless-stopped
    environment:
      - HOST=${main_domain}
      - PROTOCOL=http
      - PORT=3000
      - API_URL=http://${main_domain}
      - WEB_APP_URL=http://${main_domain}
      - APP_ENV=production
      - REDIS_HOST=automatisch-redis
      - REDIS_PASSWORD=${redis_password}
      - POSTGRES_HOST=automatisch-postgres
      - POSTGRES_DATABASE=automatisch
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${db_password}
      - ENCRYPTION_KEY=${encryption_key}
      - WEBHOOK_SECRET_KEY=${webhook_secret_key}
      - APP_SECRET_KEY=${app_secret_key}
    volumes:
      - storage:/automatisch/storage
    depends_on:
      automatisch-postgres:
        condition: service_healthy
      automatisch-redis:
        condition: service_started
    expose:
      - 3000
  automatisch-worker:
    image: automatischio/automatisch:0.15.0
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - REDIS_HOST=automatisch-redis
      - REDIS_PASSWORD=${redis_password}
      - POSTGRES_HOST=automatisch-postgres
      - POSTGRES_DATABASE=automatisch
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${db_password}
      - ENCRYPTION_KEY=${encryption_key}
      - WEBHOOK_SECRET_KEY=${webhook_secret_key}
      - APP_SECRET_KEY=${app_secret_key}
      - WORKER=true
    volumes:
      - storage:/automatisch/storage
    depends_on:
      - automatisch
  automatisch-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${db_password}
      - POSTGRES_DB=automatisch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d automatisch
      interval: 10s
      timeout: 5s
      retries: 5
  automatisch-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
volumes:
  storage: {}
  postgres_data: {}
  redis_data: {}
