[variables]
main_domain = "${domain}"
pg_password = "${password:32}"
DL_PG_PASSWORD = "${password:32}"

[[routes]]
service = "app"
port = 3000
host = "${main_domain}"

[env]
NODE_ENV = "production"
DL_ENV_TYPE = "selfHosted"
DL_PG_HOST = "postgres"
DL_PG_PORT = "5432"
DL_PG_USER = "postgres"
DL_PG_PASSWORD = "${pg_password}"
DL_PG_NAME = "domain_locker"
