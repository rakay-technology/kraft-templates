services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: always
    volumes:
      - evolution-instances:/evolution/instances
    environment:
      - SERVER_URL=https://${main_domain}
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${api_key}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - LANGUAGE=en
      - CONFIG_SESSION_PHONE_CLIENT=Evolution API
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - TELEMETRY=false
      - TELEMETRY_URL=
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgres://postgresql:${postgres_password}@evolution-postgres:5432/evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_LABELS=true
      - DATABASE_SAVE_DATA_HISTORIC=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=true
      - TYPEBOT_ENABLED=true
      - TYPEBOT_API_VERSION=latest
      - CHATWOOT_ENABLED=true
      - OPENAI_ENABLED=true
      - DIFY_ENABLED=true
      - N8N_ENABLED=true
      - EVOAI_ENABLED=true
    expose:
      - 8080
  evolution-postgres:
    image: postgres:16-alpine
    restart: always
    volumes:
      - evolution-postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=evolution
      - POSTGRES_USER=postgresql
      - POSTGRES_PASSWORD=${postgres_password}
  evolution-redis:
    image: redis:alpine
    restart: always
    volumes:
      - evolution-redis-data:/data
volumes:
  evolution-instances: null
  evolution-postgres-data: null
  evolution-redis-data: null
