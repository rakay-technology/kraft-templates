services:
  whatsapp:
    image: aldinokemal2104/go-whatsapp-web-multidevice:v9.3.1-amd
    restart: always
    expose:
      - "3080"
    volumes:
      - whatsapp:/app/storages
    command: rest '--basic-auth=${wa_user}:${wa_password}' --port=3080 --debug=true
      --os=Chrome --account-validation=false
volumes:
  whatsapp: null
