services:
  seq:
    image: datalust/seq:2025.2
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      SEQ_API_CANONICALURI: https://${main_domain}
      SEQ_FIRSTRUN_ADMINPASSWORD: ${admin_password}
    expose:
      - "80"
    volumes:
      - seq-data:/data
volumes:
  seq-data: {}
