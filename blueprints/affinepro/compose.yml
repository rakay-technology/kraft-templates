services:
  affinepro:
    image: ghcr.io/toeverything/affine:stable
    restart: unless-stopped
    expose:
      - 3010
    volumes:
      - affine-storage:/root/.affine/storage
      - affine-config:/root/.affine/config
    environment:
      - REDIS_SERVER_HOST=redis
      - REDIS_SERVER_PASSWORD=${redis_password}
      - DATABASE_URL=postgresql://postgres:${postgres_password}@db:5432/affinepro
      - AFFINE_INDEXER_ENABLED=false
      - AFFINE_SERVER_HOST=${main_domain}
      - MAILER_HOST=${main_domain}
      - MAILER_PORT=${mailer_port}
      - MAILER_USER=${mailer_user}
      - MAILER_PASSWORD=${mailer_password}
      - MAILER_SENDER=${mailer_sender}
    depends_on:
      - db
      - redis
      - migration
  migration:
    image: ghcr.io/toeverything/affine:stable
    command: sh -c 'node ./scripts/self-host-predeploy.js'
    environment:
      - REDIS_SERVER_HOST=redis
      - REDIS_SERVER_PASSWORD=${redis_password}
      - DATABASE_URL=postgresql://postgres:${postgres_password}@db:5432/affinepro
      - AFFINE_INDEXER_ENABLED=false
      - AFFINE_SERVER_HOST=${main_domain}
      - MAILER_HOST=${main_domain}
      - MAILER_PORT=${mailer_port}
      - MAILER_USER=${mailer_user}
      - MAILER_PASSWORD=${mailer_password}
      - MAILER_SENDER=${mailer_sender}
    volumes:
      - affine-storage:/root/.affine/storage
      - affine-config:/root/.affine/config
    depends_on:
      - db
      - redis
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${postgres_password}
      - POSTGRES_DB=affinepro
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - postgres
        - -d
        - affinepro
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${redis_password}
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a '${REDIS_PASSWORD}' ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  affine-storage: {}
  affine-config: {}
  postgres-data: {}
  redis-data: {}
