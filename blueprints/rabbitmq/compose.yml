services:
  rabbitmq:
    image: rabbitmq:4.1-management
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${default_user}
      - RABBITMQ_DEFAULT_PASS=${default_pass}
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit log_levels
        [{connection,error},{default,error}] disk_free_limit ${disk_free_limit}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    expose:
      - 5672
      - 15672
volumes:
  rabbitmq-data: {}
