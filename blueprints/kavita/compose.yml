services:
  kavita:
    image: jvmilazz0/kavita:0.9.1
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - TZ=${timezone}
    volumes:
      - kavita-config:/kavita/config
      - kavita-media:/manga
      - kavita-books:/books
      - kavita-comics:/comics
volumes:
  kavita-config: null
  kavita-media: null
  kavita-books: null
  kavita-comics: null
