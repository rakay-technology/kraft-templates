services:
  dash:
    image: ghcr.io/uptimekit/dash:5.1.0
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:${db_password}@db:5432/uptimekit
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${clickhouse_password}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis
    healthcheck:
      test:
        - CMD-SHELL
        - IP=$$(hostname -i | awk '{print $$1}'); wget -qO-
          "http://$$IP:3000/api/health" >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: always
    volumes: []
    expose:
      - 3000
  status-page:
    image: ghcr.io/uptimekit/status-page:4.3.0
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:${db_password}@db:5432/uptimekit
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${clickhouse_password}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis
      - clickhouse
      - dash
    restart: always
    volumes: []
    expose:
      - 3001
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${db_password}
      POSTGRES_DB: uptimekit
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d uptimekit
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: always
  redis:
    image: redis:8.0-alpine
    volumes:
      - redis_data:/data
    restart: always
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.4.11-distroless
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: uptimekit
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${clickhouse_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    user: root
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: always
volumes:
  db_data: null
  clickhouse_data: null
  redis_data: null
