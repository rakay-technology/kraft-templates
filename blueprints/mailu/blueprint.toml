[variables]
main_domain = "${domain}"
secret_key = "${password:16}"
admin_password = "${password:32}"

[[routes]]
service = "front"
port = 80
host = "${main_domain}"

[[routes]]
service = "front"
port = 25
kind = "tcp"
mode = "publish"

[[routes]]
service = "front"
port = 465
kind = "tcp"
mode = "publish"

[[routes]]
service = "front"
port = 587
kind = "tcp"
mode = "publish"

[[routes]]
service = "front"
port = 993
kind = "tcp"
mode = "publish"

[env]
DOMAIN = "${main_domain}"
SECRET_KEY = "${secret_key}"
INITIAL_ADMIN_ACCOUNT = "admin"
INITIAL_ADMIN_PW = "${admin_password}"
SUBNET = "172.16.0.0/12"
