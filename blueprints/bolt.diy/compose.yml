services:
  app:
    image: ghcr.io/stackblitz-labs/bolt.diy:v1.0.0-draft
    environment:
      - NODE_ENV=production
      - COMPOSE_PROFILES=production
      - PORT=5173
      - GROQ_API_KEY=
      - HuggingFace_API_KEY=
      - OPENAI_API_KEY=
      - ANTHROPIC_API_KEY=
      - OPEN_ROUTER_API_KEY=
      - GOOGLE_GENERATIVE_AI_API_KEY=
      - OLLAMA_API_BASE_URL=http://127.0.0.1:11434
      - XAI_API_KEY=
      - TOGETHER_API_KEY=
      - TOGETHER_API_BASE_URL=
      - AWS_BEDROCK_CONFIG=
      - VITE_LOG_LEVEL=info
      - DEFAULT_NUM_CTX=32768
      - RUNNING_IN_DOCKER=true
    extra_hosts:
      - host.docker.internal:host-gateway
    command: pnpm run dockerstart
    volumes: []
    expose:
      - 5173
