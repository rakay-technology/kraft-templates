services:
  cookiecloud:
    image: easychen/cookiecloud:2023.01.20.16.39
    restart: unless-stopped
    expose:
      - 8088
    volumes:
      - cookiecloud-data:/data/api/data
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:8088
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  cookiecloud-data: {}
