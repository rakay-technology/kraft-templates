services:
  gitea-mirror:
    image: ghcr.io/raylabshq/gitea-mirror:v3.36.1
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=3
        - --spider
        - http://localhost:4321/api/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    environment:
      - BETTER_AUTH_SECRET=64
      - BETTER_AUTH_URL=https://${main_domain}
      - NODE_ENV=production
      - DATABASE_URL=file:data/gitea-mirror.db
      - HOST=0.0.0.0
      - PORT=4321
    volumes:
      - gitea_mirror_data:/app/data
    expose:
      - 4321
volumes:
  gitea_mirror_data: null
