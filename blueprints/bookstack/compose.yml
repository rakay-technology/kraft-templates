services:
  bookstack:
    image: lscr.io/linuxserver/bookstack:24.12.1
    restart: unless-stopped
    expose:
      - 80
    environment:
      - PUID=1000
      - PGID=1000
      - APP_URL=http://${main_domain}
      - DB_HOST=bookstack-db
      - DB_USERNAME=mariadb
      - DB_PASSWORD=${db_password}
      - DB_DATABASE=bookstack
      - APP_KEY=${app_key}
    volumes:
      - config:/config
    depends_on:
      - bookstack-db
  bookstack-db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${db_password}
      - MYSQL_DATABASE=bookstack
      - MYSQL_USER=mariadb
      - MYSQL_PASSWORD=${db_password}
    volumes:
      - db_data:/var/lib/mysql
volumes:
  config: {}
  db_data: {}
