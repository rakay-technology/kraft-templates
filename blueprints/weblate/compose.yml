services:
  weblate:
    image: weblate/weblate:2026.7.1.1
    restart: unless-stopped
    depends_on:
      - database
      - cache
    volumes:
      - weblate-data:/app/data
      - weblate-cache:/app/cache
    tmpfs:
      - /run
      - /tmp
    environment:
      WEBLATE_SITE_DOMAIN: ${site_domain}
      WEBLATE_SITE_TITLE: Weblate
      WEBLATE_ADMIN_NAME: Weblate Admin
      WEBLATE_ADMIN_EMAIL: admin@${site_domain}
      WEBLATE_ADMIN_PASSWORD: ${admin_password}
      WEBLATE_SERVER_EMAIL: weblate@${site_domain}
      WEBLATE_DEFAULT_FROM_EMAIL: weblate@${site_domain}
      WEBLATE_ENABLE_HTTPS: "0"
      WEBLATE_ALLOWED_HOSTS: "*"
      WEBLATE_REGISTRATION_OPEN: "1"
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: weblate
      POSTGRES_PASSWORD: ${postgres_password}
      POSTGRES_DB: weblate
      REDIS_HOST: cache
      REDIS_PORT: 6379
    expose:
      - 8080
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      - weblate-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: weblate
      POSTGRES_PASSWORD: ${postgres_password}
      POSTGRES_DB: weblate
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
  cache:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - weblate-redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  weblate-data: null
  weblate-cache: null
  weblate-postgres-data: null
  weblate-redis-data: null
