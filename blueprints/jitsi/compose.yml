services:
  web:
    image: jitsi/web:unstable
    restart: unless-stopped
    depends_on:
      - prosody
    volumes:
      - jitsiWebConfig:/config
      - jitsiWebTranscripts:/usr/share/jitsi-meet/transcripts
    environment:
      - PUBLIC_URL=${main_domain}
      - TZ=${TZ}
      - XMPP_DOMAIN=${main_domain}
      - XMPP_AUTH_DOMAIN=${main_domain}
      - XMPP_BOSH_URL_BASE=${main_domain}
      - XMPP_MUC_DOMAIN=${main_domain}
      - XMPP_GUEST_DOMAIN=${main_domain}
      - XMPP_RECORDER_DOMAIN=${main_domain}
      - ENABLE_AUTH=${ENABLE_AUTH}
      - ENABLE_GUESTS=${ENABLE_GUESTS}
      - ENABLE_LETSENCRYPT=${ENABLE_LETSENCRYPT}
      - ENABLE_HTTP_REDIRECT=${ENABLE_HTTP_REDIRECT}
      - ENABLE_XMPP_WEBSOCKET=${ENABLE_XMPP_WEBSOCKET}
      - ENABLE_COLIBRI_WEBSOCKET=${ENABLE_COLIBRI_WEBSOCKET}
      - DISABLE_HTTPS=${DISABLE_HTTPS}
      - JICOFO_AUTH_USER=${JICOFO_AUTH_USER}
      - JVB_AUTH_USER=${JVB_AUTH_USER}
      - JICOFO_AUTH_PASSWORD=${JICOFO_AUTH_PASSWORD}
      - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD}
    expose:
      - 8000
  prosody:
    image: jitsi/prosody:unstable
    restart: unless-stopped
    volumes:
      - jitsiProsodyConfig:/config
      - jitsiProsodyPlugins:/prosody-plugins-custom
    environment:
      - TZ=${TZ}
      - XMPP_DOMAIN=${main_domain}
      - XMPP_AUTH_DOMAIN=${main_domain}
      - XMPP_MUC_DOMAIN=${main_domain}
      - XMPP_GUEST_DOMAIN=${main_domain}
      - XMPP_RECORDER_DOMAIN=${main_domain}
      - JICOFO_AUTH_USER=${JICOFO_AUTH_USER}
      - JVB_AUTH_USER=${JVB_AUTH_USER}
      - JICOFO_AUTH_PASSWORD=${JICOFO_AUTH_PASSWORD}
      - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD}
      - JICOFO_COMPONENT_SECRET=${JICOFO_COMPONENT_SECRET}
      - JWT_APP_ID=${JWT_APP_ID}
      - JWT_APP_SECRET=${JWT_APP_SECRET}
      - ENABLE_AUTH=${ENABLE_AUTH}
      - ENABLE_GUESTS=${ENABLE_GUESTS}
  jicofo:
    image: jitsi/jicofo:unstable
    restart: unless-stopped
    depends_on:
      - prosody
    volumes:
      - jitsiJicofoConfig:/config
    environment:
      - TZ=${TZ}
      - XMPP_DOMAIN=${main_domain}
      - XMPP_AUTH_DOMAIN=${main_domain}
      - XMPP_MUC_DOMAIN=${main_domain}
      - XMPP_INTERNAL_MUC_DOMAIN=${main_domain}
      - JICOFO_AUTH_USER=${JICOFO_AUTH_USER}
      - JICOFO_AUTH_PASSWORD=${JICOFO_AUTH_PASSWORD}
      - JICOFO_COMPONENT_SECRET=${JICOFO_COMPONENT_SECRET}
      - JVB_BREWERY_MUC=${JVB_BREWERY_MUC}
  jvb:
    image: jitsi/jvb:unstable
    restart: unless-stopped
    depends_on:
      - prosody
    expose:
      - 10000
    volumes:
      - jitsiJvbConfig:/config
    environment:
      - TZ=${TZ}
      - XMPP_AUTH_DOMAIN=${main_domain}
      - XMPP_INTERNAL_MUC_DOMAIN=${main_domain}
      - JVB_AUTH_USER=${JVB_AUTH_USER}
      - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD}
      - JVB_BREWERY_MUC=${JVB_BREWERY_MUC}
      - JVB_PORT=${JVB_PORT}
      - JVB_ADVERTISE_IPS=${JVB_ADVERTISE_IPS}
      - PUBLIC_URL=${main_domain}
volumes:
  jitsiWebConfig:
    driver: local
  jitsiWebTranscripts:
    driver: local
  jitsiProsodyConfig:
    driver: local
  jitsiProsodyPlugins:
    driver: local
  jitsiJicofoConfig:
    driver: local
  jitsiJvbConfig:
    driver: local
