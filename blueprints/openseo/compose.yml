services:
  openseo:
    image: ghcr.io/every-app/open-seo:v0.1.6
    restart: unless-stopped
    environment:
      - CLOUDFLARE_INCLUDE_PROCESS_ENV=true
      - PORT=3001
      - ALLOWED_HOST=${main_domain}
      - AUTH_MODE=local_noauth
      - DATAFORSEO_API_KEY=
      - OPENROUTER_API_KEY=
      - OPENROUTER_MODEL=openai/gpt-4o-mini
      - OPENSEO_TELEMETRY_DISABLED=
    expose:
      - 3001
    volumes:
      - openseo-data:/app/.wrangler
volumes:
  openseo-data: {}
