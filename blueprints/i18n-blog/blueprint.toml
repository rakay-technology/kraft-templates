[variables]
main_domain = "${domain}"
jwt_secret = "${password:32}"
recovery_mode = "false"

[[routes]]
service = "kuno"
port = 80
host = "${main_domain}"

[env]
NEXT_PUBLIC_API_URL = "https://${main_domain}/api"
DB_PATH = "/app/data/blog.db"
UPLOAD_DIR = "/app/data/uploads"
GIN_MODE = "release"
NODE_ENV = "production"
JWT_SECRET = "${jwt_secret}"
RECOVERY_MODE = "${recovery_mode}"
