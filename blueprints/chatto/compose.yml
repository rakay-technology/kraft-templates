services:
  chatto:
    image: ghcr.io/chattocorp/chatto:0.4
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      CHATTO_WEBSERVER_URL: https://${main_domain}
      CHATTO_WEBSERVER_PORT: "4000"
      CHATTO_WEBSERVER_COOKIE_SIGNING_SECRET: ${cookie_secret}
      CHATTO_CORE_SECRET_KEY: ${core_secret}
      CHATTO_CORE_ASSETS_SIGNING_SECRET: ${assets_secret}
      CHATTO_NATS_EMBEDDED_ENABLED: true
      CHATTO_NATS_EMBEDDED_DATA_DIR: /data
      CHATTO_OWNERS_EMAILS: ${owner_email}
      CHATTO_SMTP_ENABLED: "false"
      CHATTO_SMTP_HOST: ""
      CHATTO_SMTP_PORT: "587"
      CHATTO_SMTP_TLS: mandatory
      CHATTO_SMTP_USERNAME: ""
      CHATTO_SMTP_PASSWORD: ""
      CHATTO_SMTP_FROM: ""
    volumes:
      - chatto-data:/data
volumes:
  chatto-data: null
