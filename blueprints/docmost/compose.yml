services:
  docmost:
    image: docmost/docmost:0.4.1
    depends_on:
      - db
      - redis
    environment:
      - APP_URL=${main_domain}
      - APP_SECRET=${APP_SECRET}
      - DATABASE_URL=postgresql://docmost:${postgres_password}@db:5432/docmost?schema=public
      - REDIS_URL=redis://redis:6379
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage
    expose:
      - 3000
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: unless-stopped
    volumes:
      - db_docmost_data:/var/lib/postgresql/data
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
      - redis_docmost_data:/data
volumes:
  docmost: null
  db_docmost_data: null
  redis_docmost_data: null
