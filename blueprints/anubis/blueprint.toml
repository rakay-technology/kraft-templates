[variables]
main_domain = "${domain}"

[[routes]]
service = "anubis"
port = 8923
host = "${main_domain}"

[env]
COOKIE_DOMAIN = "${main_domain}"
TARGET = "YOURLOCALHOST:PORT"
DIFFICULTY = "5"
OG_PASSTHROUGH = "true"
OG_EXPIRY_TIME = "1h"
OG_CACHE_CONSIDER_HOST = "true"
SERVE_ROBOTS_TXT = "false"
mounts = ""
