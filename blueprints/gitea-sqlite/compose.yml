services:
  gitea:
    image: docker.gitea.com/gitea:1.24.4
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
    volumes:
      - gitea-data:/data
    expose:
      - "22"
      - "3000"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://localhost:3000/
      interval: 15s
      timeout: 5s
      retries: 10
volumes:
  gitea-data: {}
