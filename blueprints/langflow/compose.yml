services:
  langflow:
    image: langflowai/langflow:base-1.12.1-amd64
    user: root
    restart: always
    pull_policy: always
    expose:
      - 7860
    depends_on:
      - postgres-langflow
    environment:
      - LANGFLOW_DATABASE_URL=postgresql://${db_username}:${db_password}@postgres-langflow:5432/langflow
      - LANGFLOW_CONFIG_DIR=/app/config
      - LANGFLOW_SUPERUSER=email@domain.com
      - LANGFLOW_SUPERUSER_PASSWORD=changepassword
      - LANGFLOW_SECRET_KEY=PP_G4Gwm1lOkyG8r8N0LrdlpWXZ7Tyq5CVyfBquuj6g=
      - DO_NOT_TRACK=True
      - LANGFLOW_AUTO_SAVING=True
      - LANGFLOW_AUTO_LOGIN=False
      - LANGFLOW_NEW_USER_IS_ACTIVE=False
      - LANGFLOW_ENABLE_SUPERUSER_CLI=False
    volumes:
      - app-data:/app/langflow
      - app-config:/app/config
  postgres-langflow:
    image: postgres:16
    restart: always
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USERNAME} -d langflow
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: ${db_username}
      POSTGRES_PASSWORD: ${db_password}
      POSTGRES_DB: langflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data: null
  app-data: null
  app-config: null
