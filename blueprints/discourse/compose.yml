services:
  discourse-db:
    image: pgvector/pgvector:pg16
    volumes:
      - discourse-postgresql-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: discourse
      POSTGRES_PASSWORD: ${postgres_password}
      POSTGRES_DB: discourse
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U discourse -d discourse
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  discourse-redis:
    image: redis:7-alpine
    volumes:
      - discourse-redis-data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${REDIS_PASSWORD}
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  discourse-app:
    image: discourse/discourse:2026.1.4
    volumes:
      - discourse-data:/shared
    depends_on:
      - discourse-db
      - discourse-redis
    environment:
      DISCOURSE_HOSTNAME: ${main_domain}
      DISCOURSE_DB_HOST: discourse-db
      DISCOURSE_DB_PORT: 5432
      DISCOURSE_DB_USERNAME: discourse
      DISCOURSE_DB_PASSWORD: ${postgres_password}
      DISCOURSE_DB_NAME: discourse
      DISCOURSE_REDIS_HOST: discourse-redis
      DISCOURSE_REDIS_PORT: 6379
      DISCOURSE_REDIS_PASSWORD: ${redis_password}
      DISCOURSE_DEVELOPER_EMAILS: ${admin_email}
    expose:
      - 80
    restart: unless-stopped
volumes:
  discourse-postgresql-data: null
  discourse-redis-data: null
  discourse-data: null
