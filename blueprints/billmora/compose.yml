services:
  billmora-app:
    image: ghcr.io/billmora/billmora:1.1.1
    restart: always
    environment:
      - APP_NAME=Billmora
      - APP_ENV=production
      - APP_KEY=base64:${AUTO_BASE64_1}
      - APP_URL=https://${billmora_app_domain}
      - DB_CONNECTION=mariadb
      - DB_HOST=billmora-db
      - DB_PORT=3306
      - DB_DATABASE=billmora
      - DB_USERNAME=billmora
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=billmora-redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=6379
      - SESSION_DRIVER=redis
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - AUTORUN_ENABLED=true
      - AUTORUN_LARAVEL_MIGRATION=true
      - AUTORUN_LARAVEL_MIGRATION_FORCE=true
      - AUTORUN_LARAVEL_MIGRATION_SEED=true
      - AUTORUN_LARAVEL_STORAGE_LINK=true
    volumes:
      - billmora-storage:/var/www/html/storage
      - billmora-plugins:/var/www/html/plugin
      - billmora-themes-resources:/var/www/html/resources/themes
      - billmora-themes-public:/var/www/html/public/themes
    depends_on:
      - billmora-db
      - billmora-redis
    expose:
      - 8080
  billmora-worker:
    image: ghcr.io/billmora/billmora:1.1.1
    restart: always
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      - APP_NAME=Billmora
      - APP_ENV=production
      - APP_KEY=base64:${AUTO_BASE64_2}
      - APP_URL=https://${billmora_app_domain}
      - DB_CONNECTION=mariadb
      - DB_HOST=billmora-db
      - DB_PORT=3306
      - DB_DATABASE=billmora
      - DB_USERNAME=billmora
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=billmora-redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=6379
      - SESSION_DRIVER=redis
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - AUTORUN_ENABLED=false
    volumes:
      - billmora-storage:/var/www/html/storage
      - billmora-plugins:/var/www/html/plugin
      - billmora-themes-resources:/var/www/html/resources/themes
      - billmora-themes-public:/var/www/html/public/themes
    depends_on:
      - billmora-db
      - billmora-redis
  billmora-scheduler:
    image: ghcr.io/billmora/billmora:1.1.1
    restart: always
    command: /bin/sh -c 'while true; do php artisan schedule:run >> /dev/null 2>&1;
      sleep 60; done'
    environment:
      - APP_NAME=Billmora
      - APP_ENV=production
      - APP_KEY=base64:${AUTO_BASE64_3}
      - APP_URL=https://${billmora_app_domain}
      - DB_CONNECTION=mariadb
      - DB_HOST=billmora-db
      - DB_PORT=3306
      - DB_DATABASE=billmora
      - DB_USERNAME=billmora
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=billmora-redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=6379
      - SESSION_DRIVER=redis
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - AUTORUN_ENABLED=false
    volumes:
      - billmora-storage:/var/www/html/storage
      - billmora-plugins:/var/www/html/plugin
      - billmora-themes-resources:/var/www/html/resources/themes
      - billmora-themes-public:/var/www/html/public/themes
    depends_on:
      - billmora-db
      - billmora-redis
  billmora-db:
    image: mariadb:11
    restart: always
    environment:
      - MARIADB_DATABASE=billmora
      - MARIADB_USER=billmora
      - MARIADB_PASSWORD=${DB_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - billmora-db-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  billmora-redis:
    image: redis:8-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - billmora-redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - --no-auth-warning
        - -a
        - ${REDIS_PASSWORD}
        - ping
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
volumes:
  billmora-storage: null
  billmora-plugins: null
  billmora-themes-resources: null
  billmora-themes-public: null
  billmora-db-data: null
  billmora-redis-data: null
