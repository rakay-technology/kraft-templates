[variables]
main_domain = "${domain}"
root_password = "${password:32}"
user_password = "${password:32}"

[[routes]]
service = "phpmyadmin"
port = 80
host = "${main_domain}"

[env]
MYSQL_ROOT_PASSWORD = "${root_password}"
MYSQL_DATABASE = "phpmyadmin"
MYSQL_USER = "phpmyadmin"
MYSQL_PASSWORD = "${user_password}"
UPLOAD_LIMIT = "512M"
MAX_EXECUTION_TIME = "600"
