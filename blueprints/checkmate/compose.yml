services:
  server:
    image: ghcr.io/bluewave-labs/checkmate-backend-mono:v3.9.2
    restart: always
    expose:
      - 52345
    environment:
      - UPTIME_APP_API_BASE_URL=http://${main_domain}:52345/api/v1
      - UPTIME_APP_CLIENT_HOST=http://${main_domain}
      - DB_CONNECTION_STRING=mongodb://mongodb:27017/uptime_db?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
      - CLIENT_HOST=http://${main_domain}
      - JWT_SECRET=${jwt_secret}
    depends_on:
      - mongodb
    volumes: []
  mongodb:
    image: ghcr.io/bluewave-labs/checkmate-mongo:v3.9.2
    restart: always
    command: mongod --quiet --replSet rs0 --bind_ip_all
    volumes:
      - checkmate-mongodata:/data/db
    healthcheck:
      test: echo "try { rs.status() } catch (err) {
        rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}) }" |
        mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30
volumes:
  checkmate-mongodata: null
