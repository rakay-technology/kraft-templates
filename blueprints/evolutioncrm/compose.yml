services:
  evo-auth:
    image: evoapicloud/evo-auth-service-community:1.1.0
    command: sh -c "bundle exec rails db:prepare && bundle exec rails s -p 3001 -b
      0.0.0.0"
    restart: always
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:3001/up
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    depends_on:
      - postgres
      - redis
    environment:
      - RAILS_ENV=production
      - RAILS_MAX_THREADS=5
      - SECRET_KEY_BASE=${secret_key_base}
      - JWT_SECRET_KEY=${jwt_secret_key}
      - EVOAI_CRM_API_TOKEN=${api_token}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${postgres_password}
      - POSTGRES_DATABASE=evo_crm_production
      - POSTGRES_SSLMODE=disable
      - REDIS_URL=redis://redis:6379/3
      - FRONTEND_URL="http://${front_domain}"
      - BACKEND_URL="http://${api_domain}"
      - CORS_ORIGINS="http://${front_domain}","http://${api_domain}"
      - DOORKEEPER_JWT_SECRET_KEY=${doorkeeper_jwt_secret_key}
      - DOORKEEPER_JWT_ALGORITHM=hs256
      - DOORKEEPER_JWT_ISS=evo-auth-service
      - MFA_ISSUER=EvoCRM
    volumes: []
    expose:
      - 3001
  evo-auth-sidekiq:
    image: evoapicloud/evo-auth-service-community:1.1.0
    command: bundle exec sidekiq -C config/sidekiq.yml
    restart: always
    healthcheck:
      disable: true
    depends_on:
      - evo-auth
    environment:
      - RAILS_ENV=production
      - SECRET_KEY_BASE=${secret_key_base}
      - JWT_SECRET_KEY=${jwt_secret_key}
      - EVOAI_CRM_API_TOKEN=${api_token}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${postgres_password}
      - POSTGRES_DATABASE=evo_crm_production
      - POSTGRES_SSLMODE=disable
      - REDIS_URL=redis://redis:6379/3
      - DOORKEEPER_JWT_SECRET_KEY=${doorkeeper_jwt_secret_key}
      - DOORKEEPER_JWT_ALGORITHM=hs256
      - DOORKEEPER_JWT_ISS=evo-auth-service
      - MFA_ISSUER=EvoCRM
      - SIDEKIQ_CONCURRENCY=10
    volumes: []
  evo-crm:
    image: evoapicloud/evo-ai-crm-community:1.1.0
    command: sh -c "bundle exec rails db:prepare && bundle exec rails s -p 3000 -b
      0.0.0.0"
    restart: always
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:3000/health/live
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    depends_on:
      - evo-auth
    environment:
      - RAILS_ENV=production
      - SECRET_KEY_BASE=${secret_key_base}
      - JWT_SECRET_KEY=${jwt_secret_key}
      - EVOAI_CRM_API_TOKEN=${api_token}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${postgres_password}
      - POSTGRES_DATABASE=evo_crm_production
      - POSTGRES_SSLMODE=disable
      - REDIS_URL=redis://redis:6379/3
      - EVO_AUTH_SERVICE_URL=http://evo-auth:3001
      - EVO_AI_CORE_SERVICE_URL=http://evo-core:5555
      - BACKEND_URL="http://${api_domain}"
      - FRONTEND_URL="http://${front_domain}"
      - CORS_ORIGINS="http://${front_domain}","http://${api_domain}"
      - EVOLUTION_API_ONLY_SERVER=true
      - DISABLE_TELEMETRY=true
      - LOG_LEVEL=info
      - ENABLE_ACCOUNT_SIGNUP=true
      - ENABLE_PUSH_RELAY_SERVER=true
      - ENABLE_INBOX_EVENTS=true
      - BOT_RUNTIME_URL=http://evo-bot-runtime:8080
      - BOT_RUNTIME_SECRET=${bot_runtime_secret}
      - BOT_RUNTIME_POSTBACK_BASE_URL="http://${api_domain}"
    volumes:
      - evo-crm-data:/app/storage
    expose:
      - 3000
  evo-crm-sidekiq:
    image: evoapicloud/evo-ai-crm-community:1.1.0
    command: bundle exec sidekiq -C config/sidekiq.yml
    healthcheck:
      disable: true
    depends_on:
      - evo-crm
    environment:
      - RAILS_ENV=production
      - SECRET_KEY_BASE=${secret_key_base}
      - JWT_SECRET_KEY=${jwt_secret_key}
      - EVOAI_CRM_API_TOKEN=${api_token}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${postgres_password}
      - POSTGRES_DATABASE=evo_crm_production
      - POSTGRES_SSLMODE=disable
      - REDIS_URL=redis://redis:6379/3
      - EVO_AUTH_SERVICE_URL="http://${auth_domain}"
      - EVO_AI_CORE_SERVICE_URL=http://evo-core:5555
      - BACKEND_URL="http://${api_domain}"
      - FRONTEND_URL="http://${front_domain}"
      - CORS_ORIGINS="http://${front_domain}","http://${api_domain}","http://${auth_domain}"
      - DISABLE_TELEMETRY=true
      - LOG_LEVEL=info
      - ENABLE_ACCOUNT_SIGNUP=true
      - ENABLE_PUSH_RELAY_SERVER=true
      - ENABLE_INBOX_EVENTS=true
      - BOT_RUNTIME_URL=http://evo-bot-runtime:8080
      - BOT_RUNTIME_SECRET=${bot_runtime_secret}
      - BOT_RUNTIME_POSTBACK_BASE_URL="http://${api_domain}"
      - SIDEKIQ_CONCURRENCY=10
    volumes: []
  evo-core:
    image: evoapicloud/evo-ai-core-service-community:1.1.0
    restart: always
    depends_on:
      - postgres
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${postgres_password}
      - DB_NAME=evo_crm_production
      - DB_SSLMODE=disable
      - DB_MAX_IDLE_CONNS=10
      - DB_MAX_OPEN_CONNS=100
      - DB_CONN_MAX_LIFETIME=1h
      - DB_CONN_MAX_IDLE_TIME=30m
      - PORT=5555
      - SECRET_KEY_BASE=${secret_key_base}
      - JWT_SECRET_KEY=${jwt_secret_key}
      - JWT_ALGORITHM=HS256
      - ENCRYPTION_KEY=${encryption_key}
      - EVOLUTION_BASE_URL=http://evo-crm:3000
      - EVO_AUTH_BASE_URL=http://evo-auth:3001
      - AI_PROCESSOR_URL=http://evo-processor:8000
      - AI_PROCESSOR_VERSION=v1
    volumes: []
  evo-processor:
    image: evoapicloud/evo-ai-processor-community:1.1.0
    depends_on:
      - evo-crm
    environment:
      - POSTGRES_CONNECTION_STRING=postgresql://postgres:${postgres_password}@postgres:5432/evo_crm_production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false
      - REDIS_DB=3
      - REDIS_KEY_PREFIX="a2a:"
      - REDIS_TTL=3600
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - SECRET_KEY_BASE=${secret_key_base}
      - ENCRYPTION_KEY=${encryption_key}
      - EVOAI_CRM_API_TOKEN=${api_token}
      - EVO_AI_CRM_URL=http://evo-crm:3000
      - CORE_SERVICE_URL=http://evo-core:5555/api/v1
      - EVO_AUTH_BASE_URL=http://evo-auth:3001
      - APP_URL="http://${front_domain}"
      - API_URL="http://${processor_domain}"
      - API_TITLE=Agent Processor Community
      - API_DESCRIPTION=Agent Processor Community for Evolution AI
      - API_VERSION=1.0.0
      - ORGANIZATION_NAME=Evolution CRM
      - TOOLS_CACHE_ENABLED=true
      - TOOLS_CACHE_TTL=3600
    volumes: []
    expose:
      - 8000
  evo-bot-runtime:
    image: evoapicloud/evo-bot-runtime:1.1.0
    environment:
      - LISTEN_ADDR=0.0.0.0:8080
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/3
      - AI_PROCESSOR_URL=http://evo-processor:8000
      - BOT_RUNTIME_SECRET=${bot_runtime_secret}
      - AI_CALL_TIMEOUT_SECONDS=30
    volumes: []
  evo-crm-frontend:
    image: evoapicloud/evo-ai-frontend-community:1.1.0
    environment:
      - VITE_APP_ENV=production
      - VITE_API_URL="http://${api_domain}"
      - VITE_AUTH_API_URL="http://${auth_domain}"
      - VITE_EVOAI_API_URL="http://${evoia_domain}"
      - VITE_AGENT_PROCESSOR_URL="http://${processor_domain}"
      - VITE_WS_URL=wss://${api_domain}
      - VITE_FRONT_URL="http://${front_domain}"
    volumes: []
    expose:
      - 80
  postgres:
    image: postgres:18-alpine
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=evo_crm_community
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${postgres_password}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  redis:
    image: redis:8-alpine
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data: null
  redis-data: null
  evo-processor-data: null
  evo-crm-data: null
