services:
  glpi-mysql:
    image: mysql:9.1.0
    restart: always
    volumes:
      - glpi-mysql-data:/var/lib/mysql
  glpi-web:
    image: elestio/glpi:10.0.16
    restart: always
    volumes:
      - glpi-www-data:/var/www/html/glpi
    environment:
      - TIMEZONE=Europe/Brussels
    expose:
      - 80
volumes:
  glpi-mysql-data: null
  glpi-www-data: null
