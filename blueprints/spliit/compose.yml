services:
  spliit:
    image: ghcr.io/spliit-app/spliit:1.19.0
    restart: unless-stopped
    depends_on:
      - spliit-db
    volumes: []
    expose:
      - 3000
  spliit-db:
    image: pgvector/pgvector:pg16
    volumes:
      - spliit-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${project_name}-admin
      POSTGRES_PASSWORD: ${secret_key}
      POSTGRES_DB: spliit
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - ${project_name}-admin
        - -d
        - spliit
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  spliit-db-data: null
