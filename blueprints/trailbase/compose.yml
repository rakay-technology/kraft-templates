services:
  trailbase:
    image: trailbase/trailbase:0.33.15
    restart: unless-stopped
    volumes:
      - trailbase-data:/app/traildepot
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:4000/api/healthcheck
      interval: 30s
      timeout: 10s
      retries: 3
    expose:
      - 4000
volumes:
  trailbase-data: {}
