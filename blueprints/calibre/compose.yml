services:
  calibre:
    image: linuxserver/calibre:7.26.0
    restart: unless-stopped
    environment:
      - PASSWORD=${AUTO_PASSWORD_1}
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
    expose:
      - 8080
    volumes:
      - books:/books
      - data:/config
volumes:
  books: null
  data: null
