services:
  focalboard:
    image: mattermost/focalboard:7.11.4
    restart: unless-stopped
    volumes:
      - focalboard-data:/opt/focalboard/data
    environment:
      - VIRTUAL_HOST=${main_domain}
      - VIRTUAL_PORT=${VIRTUAL_PORT}
      - DB_TYPE=${DB_TYPE}
      - DB_CONFIG=postgres://focalboard:${POSTGRES_password}@postgres:5432/${postgres_db}?sslmode=disable
    expose:
      - 8000
  postgres:
    image: postgres:17
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - focalboard-pgdata:/var/lib/postgresql/data
volumes:
  focalboardData:
    driver: local
  focalboardPostgre:
    driver: local
  focalboard-data: null
  focalboard-pgdata: null
