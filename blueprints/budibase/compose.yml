services:
  apps:
    image: budibase/apps:3.23.47
    restart: unless-stopped
    environment:
      SELF_HOSTED: 1
      LOG_LEVEL: info
      PORT: 4002
      INTERNAL_API_KEY: ${api_key}
      API_ENCRYPTION_KEY: ${encryption_key}
      JWT_SECRET: ${jwt_secret}
      MINIO_ACCESS_KEY: ${minio_access_key}
      MINIO_SECRET_KEY: ${minio_secret_key}
      MINIO_URL: http://minio:9000
      REDIS_URL: redis:6379
      REDIS_PASSWORD: ${redis_password}
      WORKER_URL: http://worker:4003
      COUCH_DB_USERNAME: budibase
      COUCH_DB_PASSWORD: ${couchdb_password}
      COUCH_DB_URL: http://budibase:${couchdb_password}@couchdb:5984
      BUDIBASE_ENVIRONMENT: PRODUCTION
      ENABLE_ANALYTICS: "true"
      BB_ADMIN_USER_EMAIL: ""
      BB_ADMIN_USER_PASSWORD: ""
    depends_on:
      - worker
      - redis
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -qO-
        - http://localhost:4002/health
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
    volumes: []
  worker:
    image: budibase/worker:3.23.47
    restart: unless-stopped
    environment:
      SELF_HOSTED: 1
      LOG_LEVEL: info
      PORT: 4003
      CLUSTER_PORT: 10000
      INTERNAL_API_KEY: ${api_key}
      API_ENCRYPTION_KEY: ${encryption_key}
      JWT_SECRET: ${jwt_secret}
      MINIO_ACCESS_KEY: ${minio_access_key}
      MINIO_SECRET_KEY: ${minio_secret_key}
      APPS_URL: http://apps:4002
      MINIO_URL: http://minio:9000
      REDIS_URL: redis:6379
      REDIS_PASSWORD: ${redis_password}
      COUCH_DB_USERNAME: budibase
      COUCH_DB_PASSWORD: ${couchdb_password}
      COUCH_DB_URL: http://budibase:${couchdb_password}@couchdb:5984
      BUDIBASE_ENVIRONMENT: PRODUCTION
      ENABLE_ANALYTICS: "true"
    depends_on:
      - redis
      - minio
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -qO-
        - http://localhost:4003/health
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
    volumes: []
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${minio_access_key}
      MINIO_ROOT_PASSWORD: ${minio_secret_key}
      MINIO_BROWSER: off
    command: server /data --console-address ":9001"
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
      interval: 30s
      timeout: 20s
      retries: 3
  proxy:
    image: budibase/proxy:3.23.47
    restart: unless-stopped
    environment:
      PROXY_RATE_LIMIT_WEBHOOKS_PER_SECOND: 10
      PROXY_RATE_LIMIT_API_PER_SECOND: 20
      APPS_UPSTREAM_URL: http://apps:4002
      WORKER_UPSTREAM_URL: http://worker:4003
      MINIO_UPSTREAM_URL: http://minio:9000
      COUCHDB_UPSTREAM_URL: http://couchdb:5984
      WATCHTOWER_UPSTREAM_URL: http://watchtower:8080
      RESOLVER: 127.0.0.11
    depends_on:
      - minio
      - worker
      - apps
      - couchdb
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:10000/
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
    volumes: []
    expose:
      - 10000
  couchdb:
    image: budibase/couchdb:v3.3.3
    restart: unless-stopped
    environment:
      COUCHDB_USER: budibase
      COUCHDB_PASSWORD: ${couchdb_password}
      TARGETBUILD: docker-compose
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:5984/
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
    volumes:
      - couchdb3_data:/opt/couchdb/data
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --requirepass "${BB_REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${BB_REDIS_PASSWORD}
        - ping
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
volumes:
  minio_data: null
  couchdb3_data: null
  redis_data: null
