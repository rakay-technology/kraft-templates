[variables]
main_domain = "${domain}"
calcom_encryption_key = "${base64:32}"
nextauth_secret = "${base64:32}"
POSTGRES_PASSWORD = "${password:32}"

[[routes]]
service = "calcom"
port = 3000
host = "${main_domain}"

[env]
CALCOM_HOST = "${main_domain}"
NEXTAUTH_SECRET = "${nextauth_secret}"
CALENDSO_ENCRYPTION_KEY = "${calcom_encryption_key}"
DISABLE_SIGNUP = "true"
SMTP_SERVER = ""
SMTP_PORT = ""
SMTP_PASSWORD = ""
EMAIL_SERVER_USER = ""
EMAIL_FROM = ""
