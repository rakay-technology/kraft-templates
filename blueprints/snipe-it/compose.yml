services:
  snipe-it:
    image: snipe/snipe-it:v8.5.0
    restart: unless-stopped
    expose:
      - 80
    volumes:
      - snipe-it-storage:/var/lib/snipeit
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=base64:${app_key}
      - APP_URL=https://${main_domain}
      - APP_TIMEZONE=UTC
      - APP_LOCALE=en-US
      - APP_TRUSTED_PROXIES=172.0.0.0/8
      - APP_FORCE_TLS=true
      - SECURE_COOKIES=true
      - PRIVATE_FILESYSTEM_DISK=local
      - PUBLIC_FILESYSTEM_DISK=local_public
      - DB_CONNECTION=mysql
      - DB_HOST=snipe-it-db
      - DB_PORT=3306
      - DB_DATABASE=snipeit
      - DB_USERNAME=snipeit
      - DB_PASSWORD=${db_password}
      - DB_PREFIX=null
      - DB_DUMP_PATH=/usr/bin
      - DB_DUMP_SKIP_SSL=true
      - DB_CHARSET=utf8mb4
      - DB_COLLATION=utf8mb4_unicode_ci
      - MAIL_MAILER=log
      - MAIL_FROM_ADDR=snipe-it@${main_domain}
      - MAIL_FROM_NAME=Snipe-IT
      - MAIL_REPLYTO_ADDR=snipe-it@${main_domain}
      - MAIL_REPLYTO_NAME=Snipe-IT
      - ALLOW_BACKUP_DELETE=false
      - ALLOW_DATA_PURGE=false
      - IMAGE_LIB=gd
      - LOG_CHANNEL=stderr
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      - QUEUE_DRIVER=sync
    depends_on:
      - snipe-it-db
  snipe-it-db:
    image: mariadb:11.4.7
    restart: unless-stopped
    volumes:
      - snipe-it-db-data:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=snipeit
      - MYSQL_USER=snipeit
      - MYSQL_PASSWORD=${db_password}
      - MYSQL_ROOT_PASSWORD=${mysql_root_password}
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 5s
      timeout: 2s
      retries: 10
volumes:
  snipe-it-storage: null
  snipe-it-db-data: null
