services:
  shlink:
    image: shlinkio/shlink:5.1.6-roadrunner
    environment:
      - INITIAL_API_KEY=${initial_api_key}
      - DEFAULT_DOMAIN=${main_domain_shlink}
      - IS_HTTPS_ENABLED=false
    volumes:
      - shlink-data:/etc/shlink/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:8080/rest/v3/health
      interval: 30s
      timeout: 10s
      retries: 3
    expose:
      - 8080
  shlink-web:
    image: shlinkio/shlink-web-client:4.8.1
    environment:
      - SHLINK_SERVER_API_KEY=${initial_api_key}
      - SHLINK_SERVER_URL=http://${main_domain_shlink_web}
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:8080
      interval: 30s
      timeout: 10s
      retries: 3
    volumes: []
    expose:
      - 8080
volumes:
  shlink-data: null
