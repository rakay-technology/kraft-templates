services:
  evershop-app:
    image: evershop/evershop:2.2.1
    restart: always
    environment:
      DB_HOST: database
      DB_PORT: ${db_port}
      DB_PASSWORD: ${db_password}
      DB_USER: ${db_user}
      DB_NAME: ${db_name}
    depends_on:
      - database
    expose:
      - 3000
    volumes: []
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: ${db_password}
      POSTGRES_USER: ${db_user}
      POSTGRES_DB: ${db_name}
    expose:
      - 5432
volumes:
  postgres-data: null
