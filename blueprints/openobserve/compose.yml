services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.70.0
    restart: unless-stopped
    environment:
      ZO_ROOT_USER_EMAIL: ${root_email}
      ZO_ROOT_USER_PASSWORD: ${root_password}
      ZO_DATA_DIR: /data
    expose:
      - 5080
      - 5081
    volumes:
      - data:/data
volumes:
  data: null
