[variables]
main_domain = "${domain}"
db_password = "${password}"
db_user = "postiz"
db_name = "postiz"
temporal_password = "${password}"
temporal_user = "temporal"
jwt_secret = "${base64:32}"

[[routes]]
service = "postiz-app"
port = 5000
host = "${main_domain}"

[env]
POSTIZ_HOST = "${main_domain}"
JWT_SECRET = "${jwt_secret}"
DB_USER = "${db_user}"
DB_PASSWORD = "${db_password}"
DB_NAME = "${db_name}"
TEMPORAL_USER = "${temporal_user}"
TEMPORAL_PASSWORD = "${temporal_password}"
FACEBOOK_APP_ID = ""
INSTAGRAM_APP_ID = ""
LINKEDIN_CLIENT_ID = ""
YOUTUBE_CLIENT_ID = ""
TIKTOK_CLIENT_ID = ""
