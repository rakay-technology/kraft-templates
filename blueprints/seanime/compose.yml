services:
  seanime-init:
    image: busybox:1.37.0
    user: 0:0
    volumes:
      - seanime-config:/mnt/config
      - seanime-anime:/mnt/anime
      - seanime-downloads:/mnt/downloads
    command: sh -c 'chown -R 1000:1000 /mnt/config /mnt/anime /mnt/downloads && find /mnt/config -type d -exec
      chmod 755 {} + && find /mnt/config -type f -exec chmod 644 {} +'
  seanime:
    image: umagistr/seanime:v3.6.1-rootless
    depends_on:
      - seanime-init
    environment:
      - SEANIME_SERVER_HOST=0.0.0.0
    expose:
      - "43211"
    volumes:
      - seanime-config:/home/seanime/.config/Seanime
      - seanime-anime:/anime
      - seanime-downloads:/downloads
    restart: unless-stopped
volumes:
  seanime-config: null
  seanime-anime: null
  seanime-downloads: null
